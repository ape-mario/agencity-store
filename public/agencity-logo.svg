<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80" role="img" aria-label="AgenCity">
  <defs>
    <linearGradient id="ac-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <filter id="ac-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded-square mark: an agent network (nodes + edges) -->
  <g filter="url(#ac-shadow)">
    <rect x="6" y="8" width="64" height="64" rx="16" fill="url(#ac-grad)"/>
    <g stroke="#F5F0FF" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <line x1="26" y1="28" x2="50" y2="28"/>
      <line x1="26" y1="28" x2="38" y2="52"/>
      <line x1="50" y1="28" x2="38" y2="52"/>
    </g>
    <g fill="#F5F0FF">
      <circle cx="26" cy="28" r="5"/>
      <circle cx="50" cy="28" r="5"/>
      <circle cx="38" cy="52" r="5"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="84" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="30" font-weight="850" fill="#F5F0FF" letter-spacing="-0.5">
    Agen<tspan fill="#A78BFA">City</tspan>
  </text>
</svg>
